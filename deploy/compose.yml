# The migration runner of the saga schema. It defines no database and no volume: the instance is
# that of multi-tour-infra-postgres, which includes this file in the root composition (Annex J, J.7).
# It does not start with `up`; run it once per environment:
#   docker compose --env-file env/dev.env run --rm workflow-register-payment-db-migrate
services:
  workflow-register-payment-db-migrate:
    # Liquibase 5.0.4 plus the PostgreSQL driver, at exact versions (see liquibase.Dockerfile)
    build:
      context: .
      dockerfile: liquibase.Dockerfile
    image: multi-tour-workflow-register-payment-liquibase:5.0.4
    profiles: [tooling]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/${PG_DATABASE:?PG_DATABASE is required, set it in env/<environment>.env}
      LIQUIBASE_COMMAND_USERNAME: ${PG_ADMIN_USER:?PG_ADMIN_USER is required, set it in env/<environment>.env}
      LIQUIBASE_COMMAND_PASSWORD: ${PG_ADMIN_PASSWORD:?PG_ADMIN_PASSWORD is required, set it in env/<environment>.env}
    volumes:
      - ../db:/workspace:ro
    # Own control table, so two domains never share one (Annex J, J.6)
    command:
      - --search-path=/workspace
      - --changelog-file=changelog/changelog-master.yaml
      - --database-changelog-table-name=databasechangelog_workflow_register_payment
      - --database-changelog-lock-table-name=databasechangeloglock_workflow_register_payment
      - update
    networks: [platform]

  # The saga itself. It publishes no port: the api gateway is the only door (norm 5.6.1). Run the migrator first.
  # The secrets come from env/<environment>.env of multi-tour-infra-postgres; the names inside the container are
  # those of .env.example. A variable left empty is refused by the service at start, by name, so the migrator
  # above can run without them. The public key file must be readable by user 10001 (mode 644: it is public).
  # stop_grace_period outlasts the saga bound (70 s with the defaults) so a stop lets a running saga finish.
  workflow-register-payment:
    build:
      context: ..
      dockerfile: Dockerfile
    image: multi-tour-workflow-register-payment:0.1.0
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      LISTEN_ADDR: ":8080"
      CASH_REPORTING_BASE_URL: ${CASH_REPORTING_BASE_URL:-http://cash-reporting-api:8085}
      COMMERCIAL_RESERVATION_BASE_URL: ${COMMERCIAL_RESERVATION_BASE_URL:-http://commercial-reservation-api:8083}
      SERVICE_TOKEN: ${WORKFLOW_REGISTER_PAYMENT_SERVICE_TOKEN:-}
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public.pem
      DATABASE_URL: ${WORKFLOW_REGISTER_PAYMENT_DATABASE_URL:-}
      STEP_TIMEOUT: ${STEP_TIMEOUT:-5s}
      STEP_ATTEMPTS: ${STEP_ATTEMPTS:-3}
    volumes:
      - ${JWT_PUBLIC_KEY_PATH:-/dev/null}:/run/secrets/jwt_public.pem:ro
    networks: [platform]
    stop_grace_period: 90s
    restart: unless-stopped

networks:
  platform:
    external: true
